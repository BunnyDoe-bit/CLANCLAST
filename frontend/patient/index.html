<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CLANCLAST Health · live demo</title>
    <meta name="description" content="The CLANCLAST patient app, running on fictional demo data: your health identity, consent and signed summaries." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7faf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#041c19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try { var t = JSON.parse(localStorage.getItem("cc-prefs") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/patient/main.tsx"></script>
  </body>
</html>
